<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts & Recalls - MySupermarket</title>
    <meta name="description"
        content="Live tracking of UK food prices, inflation trends, and safety alerts — no predictions, just official data.">

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Alerts & Recalls - MySupermarket">
    <meta property="og:description" content="Live tracking of UK food prices, inflation trends, and safety alerts.">
    <meta property="og:url" content="https://mysupermarket.co.uk/alerts-recalls/">

    <!-- Styles -->
    <link rel="stylesheet" href="/assets/styles.css">

    <!-- Inline Critical CSS -->
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        #app {
            min-height: 100vh;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="loading">Loading...</div>
    </div>

    <!-- Route marker for SPA hydration -->
    <div id="route-data" data-route="/alerts-recalls/" style="display:none;"></div>

    <!-- App Bundle -->
    <script src="/assets/app.js" defer></script>
</body>

</html>
