<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Badge -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)" />
  
  <!-- Shopping Cart Icon -->
  <g transform="translate(106, 126) scale(0.6)" fill="none" stroke="#22c55e" stroke-width="35" stroke-linecap="round" stroke-linejoin="round" filter="url(#dropShadow)">
    <circle cx="165" cy="405" r="35" fill="#22c55e" stroke="none"/>
    <circle cx="375" cy="405" r="35" fill="#22c55e" stroke="none"/>
    <path d="M30 30h60l40 260h280l40-180H150" />
  </g>
</svg>
